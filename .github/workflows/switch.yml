name: switch
# Coimbatore 360 "collect-switch", Erode version: one click to pause or start collecting or publishing, from a phone too.
# It sets the switch in the Sheet's settings tab. Publishing also needs the repository variable PUBLISHING_ENABLED == "true" and DRY_RUN == "false".
# Anyone with write access can turn a switch OFF; only OWNER_GITHUB_LOGIN can turn publishing ON.
on:
  workflow_dispatch:
    inputs:
      switch:
        type: choice
        options: [publishing, collecting]
        default: publishing
      state:
        type: choice
        options: ["off", "on"]
        default: "off"
      reason:
        description: "Why (recorded in the Sheet)"
        required: true
permissions:
  contents: read
concurrency:
  group: switch
  cancel-in-progress: false
jobs:
  switch:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Set switch
        env:
          SHEET_BRIDGE_URL: ${{ secrets.SHEET_BRIDGE_URL }}
          SHEET_BRIDGE_KEY: ${{ secrets.SHEET_BRIDGE_KEY }}
          SWITCH_NAME: ${{ inputs.switch }}
          SWITCH_STATE: ${{ inputs.state }}
          SWITCH_REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          OWNER_GITHUB_LOGIN: ${{ vars.OWNER_GITHUB_LOGIN }}
        run: pnpm run job:switch
