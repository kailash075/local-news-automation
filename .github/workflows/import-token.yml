name: import-token
# Phase 2, run by hand: once, and again only if a token ever has to be generated anew (SETUP_GUIDE §6.3). Reads the temporary
# IG_BOOTSTRAP_TOKEN secret, checks with read-only calls that it belongs to @erodeglitz and can read the publishing quota,
# and stores it encrypted in the Sheet bridge's Script properties. Nothing is posted. Only OWNER_GITHUB_LOGIN can import.
# Delete IG_BOOTSTRAP_TOKEN after a successful run.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: token
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Import token
        env:
          SHEET_BRIDGE_URL: ${{ secrets.SHEET_BRIDGE_URL }}
          SHEET_BRIDGE_KEY: ${{ secrets.SHEET_BRIDGE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          IG_BOOTSTRAP_TOKEN: ${{ secrets.IG_BOOTSTRAP_TOKEN }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
          ACTOR: ${{ github.actor }}
          OWNER_GITHUB_LOGIN: ${{ vars.OWNER_GITHUB_LOGIN }}
        run: node src/jobs/import-token.ts
