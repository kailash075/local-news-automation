name: draft
# Coimbatore 360 "write_stories.yml", Erode version: cluster new items into stories, classify topic and risk, drop stale or
# non-Erode stories, render a text-only Tamil card (no photos, no AI images), upload it to Cloudinary, and open or
# update one review issue per story. Nothing is published here: every post waits for an editor's approval on its issue.
# Started by collect.yml and by review-command.yml (after /caption or /headline); the schedule is only a safety net,
# because GitHub sometimes skips scheduled runs, and it works only while automatic collecting is started (collect-switch).
# Like Coimbatore 360's post.yml, a scheduled run first runs a cheap "check" job and starts the Chromium job only when there
# is something to draft. A started run skips the check (and its paid minute): collect starts this workflow only when new
# items arrived, and review-command only after a /caption or /headline, so there is always work. Both jobs first expire
# stories that waited too long for an editor (48 hours, or a notice whose day is over) and close their review issues.
on:
  schedule:
    - cron: "37 7-19/4 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      story_id:
        description: "Optional: redraft only this story"
        default: ""
      refresh_issues:
        description: "Rewrite the title and text of every open review issue (after a template change)"
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: draft
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      pending: ${{ steps.check.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Anything to draft?
        id: check
        env:
          SHEET_BRIDGE_URL: ${{ secrets.SHEET_BRIDGE_URL }}
          SHEET_BRIDGE_KEY: ${{ secrets.SHEET_BRIDGE_KEY }}
          GH_TOKEN: ${{ github.token }}
          DRAFT_MODE: check
          STORY_ID: ${{ inputs.story_id }}
          REFRESH_ISSUES: ${{ inputs.refresh_issues == true && 'true' || 'false' }}
          MAX_STORY_AGE_HOURS: ${{ vars.MAX_STORY_AGE_HOURS }}
        run: node src/jobs/draft.ts
  draft:
    needs: check
    if: ${{ !cancelled() && (github.event_name != 'schedule' || (needs.check.outputs.pending != '' && needs.check.outputs.pending != '0')) }}
    runs-on: ubuntu-latest # ubuntu-slim once the Phase 0 runner spike shows Chromium works there
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - name: Draft and sync review issues
        env:
          SHEET_BRIDGE_URL: ${{ secrets.SHEET_BRIDGE_URL }}
          SHEET_BRIDGE_KEY: ${{ secrets.SHEET_BRIDGE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GH_TOKEN: ${{ github.token }}
          STORY_ID: ${{ inputs.story_id }}
          REFRESH_ISSUES: ${{ inputs.refresh_issues == true && 'true' || 'false' }}
          MAX_STORY_AGE_HOURS: ${{ vars.MAX_STORY_AGE_HOURS }}
          EDITOR_GITHUB_LOGINS: ${{ vars.EDITOR_GITHUB_LOGINS }}
        run: node src/jobs/draft.ts
