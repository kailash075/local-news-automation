name: Setup
description: >-
  Node from .node-version, then the dependencies (no install scripts run). Every second here is a paid Actions second:
  the runner's own Node is used when its major version matches, and jobs restore their production dependencies from the
  Actions cache, so pnpm only runs when pnpm-lock.yaml changed. CI (dev "true") installs everything with pnpm.
inputs:
  browser:
    description: "Also install the Chromium headless shell for rendering (true/false)"
    default: "false"
  dev:
    description: "Also install the development tools for typecheck, lint and tests (true/false)"
    default: "false"
runs:
  using: composite
  steps:
    - name: Node
      id: node
      shell: bash
      run: |
        want="$(tr -d '[:space:]' < .node-version)"
        have="$(node --version 2>/dev/null || true)"
        echo "major=$want" >> "$GITHUB_OUTPUT"
        if [ "${have%%.*}" = "v$want" ]; then
          echo "Using the runner's Node $have"
          echo "preinstalled=true" >> "$GITHUB_OUTPUT"
        else
          echo "preinstalled=false" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.node.outputs.preinstalled != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
    - name: Dependency cache
      id: deps
      if: inputs.dev != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: prod-deps-${{ runner.os }}-node${{ steps.node.outputs.major }}-${{ hashFiles('pnpm-lock.yaml') }}
    - if: inputs.dev == 'true' || steps.deps.outputs.cache-hit != 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Install dependencies
      if: inputs.dev == 'true' || steps.deps.outputs.cache-hit != 'true'
      shell: bash
      env:
        DEV: ${{ inputs.dev }}
      run: |
        if [ "$DEV" = "true" ]; then pnpm install --frozen-lockfile; else pnpm install --frozen-lockfile --prod; fi
    - name: Browser cache
      if: inputs.browser == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: pw-headless-shell-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Chromium headless shell
      if: inputs.browser == 'true'
      shell: bash
      run: |
        node node_modules/playwright-core/cli.js install chromium-headless-shell
        # Coimbatore 360 lesson: only pull system packages when the browser cannot start, because apt can hang for many minutes.
        if ! node -e 'import("playwright-core").then(async ({chromium}) => { const b = await chromium.launch(); await b.close(); })'; then
          echo "browser needs system libraries - installing them"
          timeout 600 node node_modules/playwright-core/cli.js install-deps chromium-headless-shell
        fi
